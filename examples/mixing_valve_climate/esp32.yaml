# Compilation example only; adapt the GPIOs and replace the demonstration sensor.
esphome:
  name: mixing-controller-32
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
wifi:
  ssid: EXAMPLE_ONLY
  password: example-password
packages:
  controller: !include controller.yaml
switch:
  - platform: gpio
    id: valve_open
    pin: GPIO21
    restore_mode: ALWAYS_OFF
    interlock: [valve_close]
  - platform: gpio
    id: valve_close
    pin: GPIO19
    restore_mode: ALWAYS_OFF
    interlock: [valve_open]
