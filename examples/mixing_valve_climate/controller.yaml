packages:
  ha_heat_source: !include ha-heat-source.yaml

# Package shared by both MCU compilation examples.
external_components:
  - source:
      type: local
      path: ../../components
    components: [time_based_valve, mixing_valve_climate]

# Demonstration input only. Replace with the real sensor downstream of the mixer.
sensor:
  - platform: template
    id: mixed_water_temperature
    name: Mixed water temperature
    unit_of_measurement: °C
    device_class: temperature
    lambda: return 30.0f;
    update_interval: 2s

valve:
  - platform: time_based_valve
    id: mixing_valve
    name: Mixing valve
    device_class: water
    open_duration: 120s
    close_duration: 120s
    start_position: closed
    end_positions_overrun: 5%
    open_pulse_duration: 2s
    open_pause_duration: 8s
    close_pulse_duration: 2s
    close_pause_duration: 4s
    open_action:
      - switch.turn_off: valve_close
      - switch.turn_on: valve_open
    close_action:
      - switch.turn_off: valve_open
      - switch.turn_on: valve_close
    stop_action:
      - switch.turn_off: valve_open
      - switch.turn_off: valve_close

climate:
  - platform: mixing_valve_climate
    id: water_controller
    name: Mixed water controller
    sensor: mixed_water_temperature
    valve_id: mixing_valve
    default_target_temperature: 30°C
    deadband: 2°C
    fast_close_offset: 5°C
    fast_close_hysteresis: 1°C
    deadband_number:
      name: Mixed water temperature tolerance
    fast_close_offset_number:
      name: Mixed water fast closing offset
    min_target_temperature: 18°C
    max_target_temperature: 46°C
    max_temperature: 50°C
    overtemperature_hysteresis: 2°C
    sensor_timeout: 30s
    default_mode: 'OFF'
    restore_state: true
    heat_source_required: false
    heat_source_timeout: ${boiler_heat_source_timeout}
    status:
      name: Mixed water controller status

    heat_source_status:
      name: Heat source status
    heat_source_age:
      name: Heat source age

# Native API is also used by the HA text-sensor import.
api:
